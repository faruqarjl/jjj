<style>
  /* =================================================================
   * Design tokens — cool, semi-bright. Shared by every web app page.
   *
   * Chart colours come from the validated palette, not from taste:
   * blue = AMAN, red = PERLU RESTOCK. Green/red was measured at CVD
   * ΔE 4.1 (deuteranopia) and dropped — red/green side by side is the
   * one pair colour-blind viewers cannot separate. Blue/red clears the
   * gate in both light and dark mode.
   * ================================================================= */
  :root {
    color-scheme: light;

    --brand: #0f6fde;
    --brand-strong: #0b57b0;
    --brand-wash: #e8f2fe;
    --brand-ring: rgba(15, 111, 222, .18);

    --ink: #0d1b2a;
    --ink-soft: #46586b;
    --muted: #7a8ca0;
    --line: #dbe6f1;
    --line-soft: #eaf1f8;

    --surface: #ffffff;
    --surface-2: #f7fafd;
    --bg: #eef4fa;

    --ok: #0b7f4e;
    --ok-wash: #e6f6ee;
    --warn: #9a6200;
    --warn-wash: #fdf3e0;
    --err: #c0332f;
    --err-wash: #fdeceb;

    /* chart roles */
    --series-1: #2a78d6;
    --status-aman: #2a78d6;
    --status-restok: #d03b3b;
    --status-lain: #8b98a6;
    --grid: rgba(122, 140, 160, .22);

    --radius: 14px;
    --radius-sm: 10px;
    --shadow: 0 1px 2px rgba(13, 27, 42, .05), 0 8px 24px -16px rgba(13, 27, 42, .25);
    --shadow-lift: 0 2px 6px rgba(13, 27, 42, .07), 0 18px 40px -22px rgba(13, 27, 42, .38);

    --nav-w: 232px;
    --ease: cubic-bezier(.2, .7, .3, 1);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --brand: #4b9bf5;
      --brand-strong: #7ab6fa;
      --brand-wash: #14304f;
      --brand-ring: rgba(75, 155, 245, .28);

      --ink: #e8eef6;
      --ink-soft: #a9b8c9;
      --muted: #7d8fa3;
      --line: #22334a;
      --line-soft: #1a293c;

      --surface: #131f30;
      --surface-2: #17263a;
      --bg: #0b1420;

      --ok: #45c48a;
      --ok-wash: #102e23;
      --warn: #e0a64a;
      --warn-wash: #33260f;
      --err: #f08079;
      --err-wash: #3a1b1a;

      --series-1: #3987e5;
      --status-aman: #3987e5;
      --status-restok: #d03b3b;
      --status-lain: #8b98a6;
      --grid: rgba(169, 184, 201, .18);

      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
      --shadow-lift: 0 2px 6px rgba(0, 0, 0, .5), 0 18px 40px -22px rgba(0, 0, 0, .9);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--brand); }

  /* ---------------- layout shell ---------------- */

  .app { display: flex; min-height: 100vh; }

  .nav {
    width: var(--nav-w); flex: none;
    background: var(--surface);
    border-right: 1px solid var(--line);
    padding: 20px 14px;
    display: flex; flex-direction: column; gap: 4px;
    position: sticky; top: 0; height: 100vh;
  }
  .nav .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 0 8px 18px; margin-bottom: 6px;
  }
  .nav .brand b { font-size: 15.5px; letter-spacing: -.01em; }
  .nav .brand small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 500; }
  .dot {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    background: linear-gradient(140deg, var(--brand), #37b6d9);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 15px;
  }

  .nav a.item {
    display: flex; align-items: center; gap: 11px;
    padding: 10px 11px; border-radius: var(--radius-sm);
    text-decoration: none; color: var(--ink-soft);
    font-size: 14.5px; font-weight: 600;
    transition: background .18s var(--ease), color .18s var(--ease);
  }
  .nav a.item:hover { background: var(--surface-2); color: var(--ink); }
  .nav a.item[aria-current="page"] { background: var(--brand-wash); color: var(--brand-strong); }
  .nav a.item .ic { width: 18px; text-align: center; font-size: 15px; }
  .nav .spacer { flex: 1; }
  .nav .foot { font-size: 11.5px; color: var(--muted); padding: 10px 10px 0; border-top: 1px solid var(--line-soft); }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 14px 24px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .topbar h1 { font-size: 18px; margin: 0; letter-spacing: -.015em; }
  .topbar .sub { font-size: 12.5px; color: var(--muted); margin: 2px 0 0; }
  .topbar .grow { flex: 1; }

  .content { padding: 22px 24px 64px; max-width: 1240px; width: 100%; }

  /* phone: nav becomes a bottom bar */
  @media (max-width: 860px) {
    .app { flex-direction: column; }
    .nav {
      position: fixed; bottom: 0; top: auto; left: 0; right: 0;
      width: auto; height: auto; z-index: 40;
      flex-direction: row; gap: 2px;
      border-right: 0; border-top: 1px solid var(--line);
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
      box-shadow: 0 -6px 20px -14px rgba(13, 27, 42, .5);
    }
    .nav .brand, .nav .spacer, .nav .foot { display: none; }
    .nav a.item {
      flex: 1; flex-direction: column; gap: 3px;
      padding: 8px 4px; font-size: 10.5px; min-height: 52px;
      justify-content: center; text-align: center;
    }
    .nav a.item .ic { font-size: 17px; }
    .main { padding-bottom: 68px; }
    .topbar { padding: 12px 16px; }
    .content { padding: 16px 16px 40px; }
  }

  /* ---------------- cards ---------------- */

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px;
    box-shadow: var(--shadow);
    animation: rise .3s var(--ease) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .card + .card { margin-top: 14px; }
  .card > h2 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin: 0 0 14px; font-weight: 700;
  }

  .grid { display: grid; gap: 14px; }
  .grid.c2 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .grid.c3 { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .grid.c4 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }

  .stat { background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow);
    animation: rise .3s var(--ease) both; }
  .stat .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); font-weight: 700; margin-bottom: 7px;
    display: flex; align-items: center; gap: 6px; }
  .stat .v { font-size: clamp(26px, 4vw, 34px); font-weight: 750; line-height: 1.08;
    letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
  .stat .n { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

  /* ---------------- controls ---------------- */

  label { display: block; font-size: 13.5px; font-weight: 650; margin: 0 0 6px; color: var(--ink-soft); }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }

  input, select, textarea {
    width: 100%; font: inherit; font-size: 16px;   /* 16px stops iOS zooming */
    padding: 11px 13px; min-height: 46px;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--ink);
    transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
  }
  @media (min-width: 861px) { input, select, textarea { font-size: 14.5px; min-height: 42px; } }
  textarea { min-height: 76px; resize: vertical; }
  input:focus, select:focus, textarea:focus {
    outline: 0; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-ring);
  }
  input:disabled, select:disabled { background: var(--surface-2); color: var(--muted); }

  button { font: inherit; cursor: pointer; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 14.5px; font-weight: 680; min-height: 44px; padding: 11px 18px;
    border-radius: var(--radius-sm); border: 1px solid var(--brand);
    background: var(--brand); color: #fff;
    transition: filter .15s var(--ease), transform .08s var(--ease), box-shadow .15s var(--ease);
  }
  .btn:hover { filter: brightness(1.07); box-shadow: 0 6px 18px -8px var(--brand-ring); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .6; cursor: default; filter: none; transform: none; }
  .btn.ghost { background: var(--surface); color: var(--brand); border-color: var(--line); }
  .btn.ghost:hover { background: var(--brand-wash); border-color: var(--brand); }
  .btn.danger { background: var(--err); border-color: var(--err); }
  .btn.sm { min-height: 34px; padding: 6px 12px; font-size: 13px; }
  .btn.block { width: 100%; }

  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button {
    flex: 1 1 auto; min-width: 84px; min-height: 40px; padding: 8px 14px;
    font-size: 14px; font-weight: 650; border-radius: var(--radius-sm);
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
    transition: all .18s var(--ease);
  }
  .seg button:hover { border-color: var(--brand); color: var(--brand); }
  .seg button[aria-pressed="true"] {
    border-color: var(--brand); background: var(--brand-wash); color: var(--brand-strong);
  }

  /* ---------------- table ---------------- */

  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); font-weight: 700; background: var(--surface-2);
    position: sticky; top: 0; z-index: 1; }
  tbody tr { transition: background .14s var(--ease); }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.wrap { white-space: normal; min-width: 180px; }
  .rowno { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 680;
    border: 1px solid transparent;
  }
  .pill.aman { background: var(--brand-wash); color: var(--brand-strong); border-color: var(--brand-ring); }
  .pill.restok { background: var(--err-wash); color: var(--err); border-color: rgba(208, 59, 59, .28); }
  .pill.lain { background: var(--surface-2); color: var(--muted); border-color: var(--line); }

  /* ---------------- feedback ---------------- */

  .toasts {
    position: fixed; z-index: 90; right: 18px; bottom: 18px;
    display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
    pointer-events: none;
  }
  @media (max-width: 860px) { .toasts { left: 12px; right: 12px; bottom: 80px; align-items: stretch; } }

  .toast {
    pointer-events: auto;
    display: flex; align-items: flex-start; gap: 11px;
    min-width: 260px; max-width: 420px;
    padding: 13px 15px; border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--line);
    box-shadow: var(--shadow-lift); font-size: 14px;
    animation: toastIn .34s var(--ease) both;
  }
  .toast.out { animation: toastOut .24s var(--ease) both; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(.97); } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(8px) scale(.98); } }
  .toast b { display: block; margin-bottom: 1px; }
  .toast .msg { color: var(--ink-soft); font-size: 13.5px; }
  .toast.ok { border-color: rgba(11, 127, 78, .3); }
  .toast.err { border-color: rgba(192, 51, 47, .32); }
  .toast .badge {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .toast.ok .badge { background: var(--ok-wash); }
  .toast.err .badge { background: var(--err-wash); }

  /* animated tick */
  .tick { width: 15px; height: 15px; }
  .tick path { fill: none; stroke: var(--ok); stroke-width: 3; stroke-linecap: round;
    stroke-linejoin: round; stroke-dasharray: 22; stroke-dashoffset: 22;
    animation: draw .38s .1s var(--ease) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .spinner {
    width: 15px; height: 15px; border: 2.5px solid rgba(255, 255, 255, .4);
    border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite;
  }
  .spinner.dark { border-color: var(--brand-ring); border-top-color: var(--brand); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .banner {
    display: none; align-items: flex-start; gap: 11px;
    padding: 13px 15px; border-radius: var(--radius); margin-bottom: 14px; font-size: 14px;
    animation: rise .26s var(--ease) both;
  }
  .banner.show { display: flex; }
  .banner.err { background: var(--err-wash); border: 1px solid rgba(192, 51, 47, .3); color: var(--err); }
  .banner.warn { background: var(--warn-wash); border: 1px solid rgba(154, 98, 0, .3); color: var(--warn); }
  .banner b { display: block; margin-bottom: 2px; }

  .empty { text-align: center; padding: 34px 18px; color: var(--muted); font-size: 14px; }
  .empty b { display: block; color: var(--ink); font-size: 15.5px; margin-bottom: 5px; }

  /* skeletons */
  .skel { background: var(--line-soft); border-radius: 8px; animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
  .skel.line { height: 13px; margin-bottom: 11px; }
  .skel.line:nth-child(even) { width: 78%; }
  .skel.k { height: 11px; width: 52%; margin-bottom: 10px; }
  .skel.v { height: 30px; width: 44%; }
  .skel.block { height: 240px; }

  /* ---------------- modal ---------------- */

  .backdrop {
    position: fixed; inset: 0; z-index: 70;
    background: rgba(13, 27, 42, .45); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; padding: 18px;
    animation: fade .2s var(--ease) both;
  }
  @keyframes fade { from { opacity: 0; } }
  .modal {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; box-shadow: var(--shadow-lift);
    width: min(560px, 100%); max-height: 88vh; overflow: auto;
    animation: pop .28s var(--ease) both;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(16px) scale(.97); } }
  .modal header {
    padding: 18px 20px 14px; border-bottom: 1px solid var(--line-soft);
    display: flex; align-items: flex-start; gap: 12px;
    position: sticky; top: 0; background: var(--surface); z-index: 1;
  }
  .modal header h3 { margin: 0; font-size: 16.5px; letter-spacing: -.01em; }
  .modal header p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
  .modal .body { padding: 18px 20px; }
  .modal .foot {
    padding: 14px 20px 18px; display: flex; gap: 10px; justify-content: flex-end;
    border-top: 1px solid var(--line-soft); flex-wrap: wrap;
    position: sticky; bottom: 0; background: var(--surface);
  }
  .x { border: 0; background: none; color: var(--muted); font-size: 22px; line-height: 1;
    padding: 2px 6px; border-radius: 8px; margin-left: auto; }
  .x:hover { background: var(--surface-2); color: var(--ink); }

  .hidden { display: none !important; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 7px 0 0; }
  .ro { font-size: 12.5px; color: var(--muted); text-align: center; margin: 20px 0 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
